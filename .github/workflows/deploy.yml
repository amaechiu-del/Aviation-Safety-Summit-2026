name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE GCP_SA_KEY APP_URL PAYSTACK_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Run repository lint script
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate required Secret Manager secrets
        run: |
          gcloud secrets describe GEMINI_API_KEY --project "$GCP_PROJECT_ID" >/dev/null
          gcloud secrets describe PAYSTACK_SECRET_KEY --project "$GCP_PROJECT_ID" >/dev/null

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          source: .
          env_vars: |
            NODE_ENV=production
            APP_URL=${{ secrets.APP_URL }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            PAYSTACK_SECRET_KEY=PAYSTACK_SECRET_KEY:latest
